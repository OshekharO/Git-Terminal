<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Practice Terminal - Learn Git Commands Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .terminal-bg {
            background: #0d1117;
        }
        
        .terminal-header {
            background: linear-gradient(135deg, #1a1f2e 0%, #161b22 100%);
        }
        
        .git-branch {
            color: #f778ba;
        }
        
        .git-added {
            color: #3fb950;
        }
        
        .git-modified {
            color: #d29922;
        }
        
        .git-deleted {
            color: #f85149;
        }
        
        .git-untracked {
            color: #8b949e;
        }
        
        .commit-hash {
            color: #58a6ff;
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .file-icon {
            display: inline-block;
            width: 16px;
            text-align: center;
            margin-right: 8px;
            font-weight: bold;
        }

        /* Custom scrollbar */
        .terminal-output::-webkit-scrollbar {
            width: 6px;
        }
        
        .terminal-output::-webkit-scrollbar-track {
            background: #1a1f2e;
        }
        
        .terminal-output::-webkit-scrollbar-thumb {
            background: #58a6ff;
            border-radius: 3px;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .mobile-stack {
                flex-direction: column;
            }
            
            .mobile-text-sm {
                font-size: 0.875rem;
            }
            
            .mobile-p-3 {
                padding: 0.75rem;
            }
            
            .mobile-space-y-2 > * + * {
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body class="terminal-bg text-gray-100 min-h-screen">
    <div class="container mx-auto px-3 py-4 md:px-4 md:py-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4 md:mb-6">
            <div class="flex items-center space-x-2 md:space-x-3">
                <div class="w-2 h-2 md:w-3 md:h-3 bg-red-500 rounded-full"></div>
                <div class="w-2 h-2 md:w-3 md:h-3 bg-yellow-500 rounded-full"></div>
                <div class="w-2 h-2 md:w-3 md:h-3 bg-green-500 rounded-full"></div>
                <h1 class="text-lg md:text-xl font-semibold ml-1 md:ml-2">Git Practice</h1>
            </div>
            <div class="flex items-center space-x-1 md:space-x-2 text-xs md:text-sm">
                <span class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded text-xs">v2.1.0</span>
                <span class="px-2 py-1 bg-green-500/20 text-green-300 rounded text-xs">Online</span>
            </div>
        </div>

        <!-- Terminal Container -->
        <div class="bg-gray-900 rounded-lg md:rounded-xl border border-gray-700 shadow-xl overflow-hidden">
            <!-- Terminal Header -->
            <div class="terminal-header border-b border-gray-700 px-4 py-3 md:px-6 md:py-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between space-y-3 md:space-y-0">
                    <div class="flex items-center space-x-2 md:space-x-4">
                        <div class="flex items-center space-x-2">
                            <i class="fab fa-git-alt text-orange-500 text-lg"></i>
                            <span class="font-semibold text-sm md:text-base">git-practice</span>
                        </div>
                        <div class="text-xs md:text-sm text-gray-400">
                            Learn Git interactively
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1 md:gap-2">
                        <button id="btn-clear" class="px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm transition-colors flex items-center">
                            <i class="fas fa-erasher mr-1 text-xs"></i>Clear
                        </button>
                        <button id="btn-reset" class="px-2 py-1 md:px-3 md:py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 rounded text-xs md:text-sm transition-colors flex items-center">
                            <i class="fas fa-redo mr-1 text-xs"></i>Reset
                        </button>
                        <button id="btn-exercise" class="px-2 py-1 md:px-3 md:py-1.5 bg-green-500/20 hover:bg-green-500/30 text-green-300 rounded text-xs md:text-sm transition-colors flex items-center">
                            <i class="fas fa-graduation-cap mr-1 text-xs"></i>Exercise
                        </button>
                        <button id="btn-tutorial" class="px-2 py-1 md:px-3 md:py-1.5 bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 rounded text-xs md:text-sm transition-colors flex items-center">
                            <i class="fas fa-book mr-1 text-xs"></i>Help
                        </button>
                    </div>
                </div>
            </div>

            <!-- Terminal Body -->
            <div class="p-3 md:p-6">
                <div id="terminal-output" class="terminal-output mb-3 md:mb-4 space-y-1 md:space-y-2 min-h-[300px] md:min-h-[400px] max-h-[400px] md:max-h-[500px] overflow-y-auto text-sm md:text-base">
                    <!-- Output will be inserted here -->
                </div>
                
                <!-- Input Area -->
                <div class="flex items-center space-x-2 md:space-x-3 bg-gray-800 rounded-lg px-3 py-2 md:px-4 md:py-3 border border-gray-700">
                    <div id="prompt" class="text-green-400 font-medium whitespace-nowrap text-sm md:text-base">
                        git-practice <span id="branch-indicator"></span>:<span class="text-blue-400">~</span>$ 
                    </div>
                    <input 
                        id="cmdline" 
                        type="text" 
                        class="flex-1 bg-transparent border-none outline-none text-gray-100 placeholder-gray-500 text-sm md:text-base"
                        placeholder="Type 'git help' for commands..."
                        autocomplete="off"
                        spellcheck="false"
                        autofocus
                    >
                    <div class="blink text-green-400 text-sm md:text-base">|</div>
                </div>

                <!-- Quick Actions -->
                <div class="mt-3 md:mt-4 flex flex-wrap gap-1 md:gap-2">
                    <button data-cmd="git status" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm transition-colors">
                        status
                    </button>
                    <button data-cmd="git log --oneline" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm transition-colors">
                        log
                    </button>
                    <button data-cmd="git branch" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm transition-colors">
                        branch
                    </button>
                    <button data-cmd="git add ." class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm transition-colors">
                        add .
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-4 md:mt-6 text-center text-xs md:text-sm text-gray-500">
            <div class="flex flex-wrap justify-center gap-3 md:gap-6 mb-2">
                <span class="flex items-center"><i class="fas fa-code-branch mr-1"></i> Git Simulation</span>
                <span class="flex items-center"><i class="fas fa-play-circle mr-1"></i> Interactive</span>
                <span class="flex items-center"><i class="fas fa-tasks mr-1"></i> Exercises</span>
            </div>
            Practice Git commands safely in your browser
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 px-3 md:px-0">
        <div class="bg-gray-800 rounded-lg md:rounded-xl border border-gray-700 w-full max-w-2xl md:max-w-4xl mx-auto max-h-[90vh] md:max-h-[80vh] overflow-hidden">
            <div class="flex items-center justify-between p-4 md:p-6 border-b border-gray-700">
                <h3 class="text-lg md:text-xl font-semibold">Git Tutorial & Exercises</h3>
                <button id="close-tutorial" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times text-lg md:text-xl"></i>
                </button>
            </div>
            <div id="tutorial-content" class="p-4 md:p-6 overflow-y-auto max-h-[70vh] md:max-h-[60vh] text-sm md:text-base">
                <!-- Tutorial content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="git-terminal.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Practice Terminal - Learn Git Commands Online</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styles -->
    <link rel="stylesheet" href="src/styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="terminal-bg text-gray-100 min-h-screen">
    <div class="main-container container mx-auto px-3 py-4 md:px-4 md:py-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4 md:mb-6">
            <div class="window-controls flex items-center space-x-2 md:space-x-3">
                <div class="window-dot w-2 h-2 md:w-3 md:h-3 bg-red-500 rounded-full cursor-pointer"></div>
                <div class="window-dot w-2 h-2 md:w-3 md:h-3 bg-yellow-500 rounded-full cursor-pointer"></div>
                <div class="window-dot w-2 h-2 md:w-3 md:h-3 bg-green-500 rounded-full cursor-pointer"></div>
                <h1 class="header-title text-base sm:text-lg md:text-xl font-semibold ml-1 md:ml-2">Git Practice</h1>
            </div>
            <div class="flex items-center space-x-1 md:space-x-2 text-xs md:text-sm">
                <span class="status-badge px-2 py-1 bg-blue-500/20 text-blue-300 rounded text-xs cursor-default">v2.2.0</span>
                <span class="status-badge px-2 py-1 bg-green-500/20 text-green-300 rounded text-xs flex items-center cursor-default">
                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full mr-1 animate-pulse"></span>
                    Online
                </span>
                <button id="btn-theme" class="btn-interactive px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs" aria-label="Toggle theme" title="Toggle dark/light theme">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <!-- Terminal Container -->
        <div class="bg-gray-900 rounded-lg md:rounded-xl border border-gray-700 shadow-xl overflow-hidden">
            <!-- Terminal Header -->
            <div class="terminal-header border-b border-gray-700 px-3 py-2 sm:px-4 sm:py-3 md:px-6 md:py-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-0">
                    <div class="flex items-center space-x-2 md:space-x-4">
                        <div class="flex items-center space-x-2">
                            <i class="fab fa-git-alt text-orange-500 text-base sm:text-lg"></i>
                            <span class="font-semibold text-xs sm:text-sm md:text-base">git-practice</span>
                        </div>
                        <div class="hidden sm:block text-xs md:text-sm text-gray-400">
                            Learn Git interactively
                        </div>
                    </div>
                    <div class="header-buttons flex flex-wrap gap-1 md:gap-2">
                        <button id="btn-clear" class="btn-interactive px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm flex items-center" aria-label="Clear terminal output">
                            <i class="fas fa-eraser mr-1 text-xs" aria-hidden="true"></i><span>Clear</span>
                        </button>
                        <button id="btn-copy" class="btn-interactive px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm flex items-center" aria-label="Copy terminal output">
                            <i class="fas fa-copy mr-1 text-xs" aria-hidden="true"></i><span>Copy</span>
                        </button>
                        <button id="btn-reset" class="btn-interactive px-2 py-1 md:px-3 md:py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 rounded text-xs md:text-sm flex items-center" aria-label="Reset repository">
                            <i class="fas fa-redo mr-1 text-xs" aria-hidden="true"></i><span>Reset</span>
                        </button>
                        <button id="btn-exercise" class="btn-interactive px-2 py-1 md:px-3 md:py-1.5 bg-green-500/20 hover:bg-green-500/30 text-green-300 rounded text-xs md:text-sm flex items-center" aria-label="Start exercise">
                            <i class="fas fa-graduation-cap mr-1 text-xs" aria-hidden="true"></i><span>Exercise</span>
                        </button>
                        <button id="btn-tutorial" class="btn-interactive px-2 py-1 md:px-3 md:py-1.5 bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 rounded text-xs md:text-sm flex items-center" aria-label="Open help and tutorial">
                            <i class="fas fa-book mr-1 text-xs" aria-hidden="true"></i><span>Help</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Terminal Body -->
            <div class="terminal-body p-3 md:p-6">
                <div id="terminal-output"
                     class="terminal-output mb-3 md:mb-4 space-y-1 md:space-y-2 text-xs sm:text-sm md:text-base"
                     role="log"
                     aria-live="polite"
                     aria-label="Terminal output">
                    <!-- Output will be inserted here -->
                </div>

                <!-- Search Bar -->
                <div id="search-bar" class="hidden mb-3 md:mb-4">
                    <div class="flex items-center space-x-2 bg-gray-800 rounded-lg px-3 py-2 border border-gray-700">
                        <i class="fas fa-search text-gray-400 text-sm"></i>
                        <input id="search-input" type="text" placeholder="Search in terminal output..."
                               class="flex-1 bg-transparent border-none outline-none text-gray-100 placeholder-gray-500 text-sm"
                               autocomplete="off" spellcheck="false">
                        <span id="search-count" class="text-xs text-gray-400"></span>
                        <button id="search-prev" class="text-gray-400 hover:text-white px-1" aria-label="Previous match">
                            <i class="fas fa-chevron-up text-xs"></i>
                        </button>
                        <button id="search-next" class="text-gray-400 hover:text-white px-1" aria-label="Next match">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <button id="search-close" class="text-gray-400 hover:text-white px-1" aria-label="Close search">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-container flex items-center space-x-2 md:space-x-3 bg-gray-800 rounded-lg px-2 py-2 sm:px-3 sm:py-2 md:px-4 md:py-3">
                    <div id="prompt" class="prompt-text text-green-400 font-medium whitespace-nowrap text-xs sm:text-sm md:text-base flex-shrink-0">
                        <span class="hidden sm:inline">git-practice</span><span id="branch-indicator"></span><span class="hidden sm:inline text-blue-400">:~</span>$ 
                    </div>
                    <input 
                        id="cmdline" 
                        type="text" 
                        class="cmd-input flex-1 bg-transparent border-none outline-none text-gray-100 placeholder-gray-500 text-xs sm:text-sm md:text-base min-w-0"
                        placeholder="Type 'git help' for commands..."
                        autocomplete="off"
                        spellcheck="false"
                        autofocus
                        aria-label="Git command input"
                        role="textbox"
                        aria-multiline="false"
                    >
                    <div class="blink text-green-400 text-sm md:text-base flex-shrink-0">|</div>
                </div>

                <!-- Quick Actions -->
                <div class="quick-actions mt-3 md:mt-4 flex flex-wrap gap-1 md:gap-2">
                    <button data-cmd="git status" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm">
                        status
                    </button>
                    <button data-cmd="git log --oneline" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm">
                        log
                    </button>
                    <button data-cmd="git branch" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm">
                        branch
                    </button>
                    <button data-cmd="git add ." class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm">
                        add .
                    </button>
                    <button data-cmd="git init" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm">
                        init
                    </button>
                    <button data-cmd="git diff" class="quick-cmd px-2 py-1 md:px-3 md:py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm">
                        diff
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-4 md:mt-6 text-center text-xs md:text-sm text-gray-500">
            <div class="flex flex-wrap justify-center gap-3 md:gap-6 mb-2">
                <span class="flex items-center transition-colors hover:text-gray-300 cursor-default"><i class="fas fa-code-branch mr-1"></i> Git Simulation</span>
                <span class="flex items-center transition-colors hover:text-gray-300 cursor-default"><i class="fas fa-play-circle mr-1"></i> Interactive</span>
                <span class="flex items-center transition-colors hover:text-gray-300 cursor-default"><i class="fas fa-tasks mr-1"></i> Exercises</span>
            </div>
            <p class="text-gray-600">Practice Git commands safely in your browser</p>
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 px-3 md:px-0"
         role="dialog" aria-modal="true" aria-labelledby="tutorial-modal-title">
        <div class="modal-content bg-gray-800 rounded-lg md:rounded-xl border border-gray-700 w-full max-w-2xl md:max-w-4xl mx-auto max-h-[90vh] md:max-h-[80vh] overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between p-4 md:p-6 border-b border-gray-700 bg-gray-900/50">
                <h3 id="tutorial-modal-title" class="text-base sm:text-lg md:text-xl font-semibold flex items-center">
                    <i class="fas fa-graduation-cap mr-2 text-green-400" aria-hidden="true"></i>
                    Git Tutorial &amp; Exercises
                </h3>
                <button id="close-tutorial" class="btn-interactive text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-700 transition-colors" aria-label="Close tutorial">
                    <i class="fas fa-times text-lg md:text-xl" aria-hidden="true"></i>
                </button>
            </div>
            <div id="tutorial-content" class="p-4 md:p-6 overflow-y-auto max-h-[70vh] md:max-h-[60vh] text-sm md:text-base">
                <!-- Tutorial content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Text Editor Modal (nano/vim simulation) -->
    <div id="editor-modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50 px-2 sm:px-4 md:px-0"
         role="dialog" aria-modal="true" aria-labelledby="editor-modal-title">
        <div class="modal-content bg-gray-900 rounded-lg border border-gray-600 w-full max-w-4xl mx-auto max-h-[90vh] sm:max-h-[95vh] overflow-hidden shadow-2xl flex flex-col">
            <!-- Editor Header -->
            <div id="editor-header" class="flex items-center justify-between px-2 sm:px-3 py-2 bg-gray-800 border-b border-gray-700">
                <div class="flex items-center space-x-2 sm:space-x-3 min-w-0 flex-1">
                    <span id="editor-type" class="text-green-400 font-semibold text-xs sm:text-sm flex-shrink-0">GNU nano</span>
                    <span id="editor-filename" class="text-gray-300 text-xs sm:text-sm truncate">filename.txt</span>
                    <span id="editor-modified" class="text-yellow-400 text-xs hidden flex-shrink-0">[Modified]</span>
                </div>
                <div class="flex items-center space-x-2 flex-shrink-0 ml-2">
                    <button id="editor-save-btn" class="editor-action-btn px-2 py-1 sm:px-3 sm:py-1.5 bg-green-600 hover:bg-green-500 text-white rounded text-xs sm:text-sm flex items-center" aria-label="Save file">
                        <i class="fas fa-save mr-1" aria-hidden="true"></i><span>Save</span>
                    </button>
                    <button id="editor-close-btn" class="editor-action-btn px-2 py-1 sm:px-3 sm:py-1.5 bg-red-600 hover:bg-red-500 text-white rounded text-xs sm:text-sm flex items-center" aria-label="Close editor">
                        <i class="fas fa-times mr-1" aria-hidden="true"></i><span>Close</span>
                    </button>
                </div>
            </div>
            
            <!-- Editor Content Area -->
            <div class="flex-1 p-0 overflow-hidden min-h-0">
                <div class="flex h-full">
                    <!-- Line numbers -->
                    <div id="editor-line-numbers" class="bg-gray-800 text-gray-500 text-right py-2 px-1 sm:px-2 text-xs sm:text-sm font-mono select-none border-r border-gray-700 overflow-hidden flex-shrink-0" style="min-width: 2.5rem;">
                        1
                    </div>
                    <!-- Text area -->
                    <textarea 
                        id="editor-textarea" 
                        class="flex-1 bg-gray-900 text-gray-100 p-2 text-sm sm:text-base font-mono resize-none outline-none border-none min-h-0"
                        style="min-height: 200px; height: 100%;"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                    ></textarea>
                </div>
            </div>
            
            <!-- Editor Footer (nano style) - hide some options on very small screens -->
            <div id="editor-footer" class="bg-gray-800 border-t border-gray-700 px-2 py-1.5">
                <div class="flex flex-wrap gap-x-3 sm:gap-x-4 gap-y-1 text-xs text-gray-400">
                    <span class="hidden sm:inline"><kbd class="text-white">^G</kbd> Help</span>
                    <span><kbd class="text-white">^O</kbd> Save</span>
                    <span><kbd class="text-white">^X</kbd> Exit</span>
                    <span class="hidden sm:inline"><kbd class="text-white">^K</kbd> Cut</span>
                    <span class="hidden sm:inline"><kbd class="text-white">^U</kbd> Paste</span>
                    <span class="hidden md:inline"><kbd class="text-white">^W</kbd> Where Is</span>
                </div>
            </div>
            
            <!-- Status bar -->
            <div id="editor-status" class="bg-gray-700 px-2 sm:px-3 py-1 text-xs text-gray-300 flex justify-between">
                <span id="editor-cursor-pos">Line 1, Col 1</span>
                <span id="editor-status-msg" class="text-green-400"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
